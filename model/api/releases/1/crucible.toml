[compatibility]
sdk_source = true
severity = "error"
wire = true

[model]
imports = ["crucible.errors"]
language = 1
namespace = "example.service"
sources = ["."]

[rules.documentation]
severity = "warning"
targets = ["operations", "errors"]

[rules.naming]
enum_values = "SCREAMING_SNAKE_CASE"
members = "camelCase"
operations = "PascalCase"
severity = "error"
shapes = "PascalCase"

[rules.paths]
parameter_case = "camelCase"
segment_case = "kebab-case"
severity = "error"
