# The model package: its namespace and imports, and the API policy every
# build applies (docs/api-policy.md in Crucible). A check written as a table
# sets its own severity: members = { case = "camelCase", severity = "warning" }.
[model]
namespace = "example.service"
language = 1
sources = ["."]
imports = ["crucible.errors"]

# The last released contract, frozen with `crucible freeze model/api`. A
# breaking change against it compiles only when a `migration` declares it
# (migrations.cru), and the service keeps serving release 1's clients.
[model.baseline]
path = "releases/1.json"

[rules.naming]
severity = "error"
operations = "PascalCase"
shapes = "PascalCase"
members = "camelCase"
enum_values = "SCREAMING_SNAKE_CASE"

[rules.paths]
severity = "error"
segment_case = "kebab-case"
parameter_case = "camelCase"

[rules.documentation]
severity = "warning"
targets = ["operations", "errors"]

[compatibility]
severity = "error"
wire = true
sdk_source = true
