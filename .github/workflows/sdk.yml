name: SDK consumers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sdk-consumers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and verify the service and native SDK consumers
        run: python tools/check-sdks.py
