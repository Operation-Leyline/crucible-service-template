name: SDK consumers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sdk-consumers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate private framework dependencies
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.CRUCIBLE_APP_ID }}
          private-key: ${{ secrets.CRUCIBLE_APP_PRIVATE_KEY }}
          owner: Operation-Leyline
          repositories: crucible
          permission-contents: read
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and verify the service and native SDK consumers
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git
          python tools/check-sdks.py
