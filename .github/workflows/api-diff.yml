name: API compatibility

on:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Authenticate private tooling checkout
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.CRUCIBLE_APP_ID }}
          private-key: ${{ secrets.CRUCIBLE_APP_PRIVATE_KEY }}
          owner: Operation-Leyline
          repositories: |
            crucible
            crucible-actions
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          repository: Operation-Leyline/crucible-actions
          ref: 31cacf98b4960f90eb541b8df41a9661d2dab2a3
          token: ${{ steps.app-token.outputs.token }}
          path: crucible-actions
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: proposed
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: ./crucible-actions/setup-crucible
        id: tooling
        with:
          crucible-ref: 98bf404f86f99b7b9a759ca984f3ed4e9acc5f6c
          token: ${{ steps.app-token.outputs.token }}
      - uses: ./crucible-actions/api-diff
        with:
          cli: ${{ steps.tooling.outputs.cli }}
          before: baseline/smithy
          after: proposed/smithy
          config: proposed/crucible.toml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-diff-report
          path: api-diff-report
          if-no-files-found: ignore
