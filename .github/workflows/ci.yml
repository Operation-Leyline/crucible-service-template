name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: Operation-Leyline/crucible-actions/setup-crucible@4d0ee1e011a0c42f2d36de4c0abbb23501c38f39
      - run: crucible check model/api
      - run: crucible sdk generate
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Compile the generated TypeScript SDK
        working-directory: target/sdk/typescript
        run: npm install && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Smoke test over HTTP
        run: |
          cargo build --locked
          CRUCIBLE_ADDR=127.0.0.1:8080 cargo run --locked &
          for _ in $(seq 100); do curl -s -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.2; done
          python3 service/tools/smoke.py http://127.0.0.1:8080
          curl --fail --silent http://127.0.0.1:8080/explorer/ > /dev/null
