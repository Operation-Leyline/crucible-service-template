[package]
name = "crucible-service"
version = "0.1.0"
edition = "2024"

[package.metadata.smithy]
sources = ["../smithy/model"]

[dependencies]
crucible-server-runtime-rust.workspace = true
service-model = { path = "../smithy" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
crucible-build.workspace = true
