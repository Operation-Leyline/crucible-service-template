[package]
name = "crucible-service"
version = "0.1.0"
edition = "2024"

[dependencies]
crucible-server-runtime-rust.workspace = true
service-model = { path = "../model" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
getrandom = "0.4"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
crucible-build.workspace = true
