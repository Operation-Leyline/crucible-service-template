[workspace]
members = ["model", "service"]
exclude = ["client", "target/rust-sdk"]
default-members = ["service"]
resolver = "3"

[workspace.dependencies]
crucible-server-runtime-rust = { git = "https://github.com/Operation-Leyline/crucible", rev = "254d217f33c52c358923afe260ed122274f0262b", default-features = false, features = ["http"] }
crucible-build = { git = "https://github.com/Operation-Leyline/crucible", rev = "254d217f33c52c358923afe260ed122274f0262b", features = ["java"] }
