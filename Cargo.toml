resolver = "3"

[workspace.dependencies]
crucible = { git = "https://github.com/Operation-Leyline/crucible", rev = "d11e9d32a5546011bf63f9f618c39cac4e82d70e", default-features = false, features = ["http"] }
crucible-build = { git = "https://github.com/Operation-Leyline/crucible", rev = "d11e9d32a5546011bf63f9f618c39cac4e82d70e", features = ["java"] }
