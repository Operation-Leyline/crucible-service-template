[workspace]
members = ["model", "service"]
exclude = ["client", "target/rust-sdk"]
default-members = ["service"]
resolver = "3"

[workspace.dependencies]
crucible-server-runtime-rust = { git = "https://github.com/Operation-Leyline/crucible", rev = "f753776a0246bfdd35b5413fadafeb703e9edd02", default-features = false, features = ["http"] }
crucible-build = { git = "https://github.com/Operation-Leyline/crucible", rev = "f753776a0246bfdd35b5413fadafeb703e9edd02", features = ["java"] }
