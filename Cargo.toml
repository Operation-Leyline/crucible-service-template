[workspace]
members = ["model", "service"]
default-members = ["service"]
resolver = "3"

[workspace.dependencies]
crucible-server-runtime-rust = { git = "https://github.com/Operation-Leyline/crucible", tag = "v0.9.0", default-features = false, features = ["http", "explorer", "idempotency", "page-tokens", "test-support"] }
crucible-build = { git = "https://github.com/Operation-Leyline/crucible", tag = "v0.9.0", features = ["openapi"] }
