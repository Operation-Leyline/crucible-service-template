[package]
name = "crucible-service"
version = "0.1.0"
edition = "2024"

[package.metadata.smithy]
sources = ["smithy"]

[dependencies]
crucible = { git = "https://github.com/Operation-Leyline/crucible", rev = "da59322f562072df6597bdfd5eabb25aa26917ea", default-features = false, features = ["http"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[build-dependencies]
crucible-build = { git = "https://github.com/Operation-Leyline/crucible", rev = "da59322f562072df6597bdfd5eabb25aa26917ea" }
