[workspace]
members = ["model", "service"]
exclude = ["client", "target/rust-sdk"]
default-members = ["service"]
resolver = "3"

[workspace.dependencies]
crucible-server-runtime-rust = { git = "https://github.com/Operation-Leyline/crucible", rev = "2572007dfe7145ede4cf79dd82591021e9b50772", default-features = false, features = ["http"] }
crucible-build = { git = "https://github.com/Operation-Leyline/crucible", rev = "2572007dfe7145ede4cf79dd82591021e9b50772", features = ["java", "openapi"] }
