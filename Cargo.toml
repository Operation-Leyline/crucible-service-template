[workspace]
members = ["smithy", "service"]
exclude = ["client", "target/rust-sdk"]
default-members = ["service"]
resolver = "3"

[workspace.dependencies]
crucible-server-runtime-rust = { git = "https://github.com/Operation-Leyline/crucible", rev = "b5b10da90f687777ff94b2808ac048ff29ac6c32", default-features = false, features = ["http"] }
crucible-build = { git = "https://github.com/Operation-Leyline/crucible", rev = "b5b10da90f687777ff94b2808ac048ff29ac6c32", features = ["java"] }
