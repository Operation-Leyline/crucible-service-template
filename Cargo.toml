[package]
name = "crucible-service"
version = "0.1.0"
edition = "2024"

[package.metadata.smithy]
sources = ["smithy"]

[dependencies]
crucible = { git = "https://github.com/Operation-Leyline/crucible", rev = "20af40c503f2a34f5babc870dcb8cb7c59575a5d", default-features = false, features = ["http"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[build-dependencies]
crucible-build = { git = "https://github.com/Operation-Leyline/crucible", rev = "20af40c503f2a34f5babc870dcb8cb7c59575a5d" }
