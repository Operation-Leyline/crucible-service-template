[workspace]
members = ["smithy", "service"]
exclude = ["client", "target/rust-sdk"]
default-members = ["service"]
resolver = "3"

[workspace.dependencies]
crucible-server-runtime-rust = { git = "https://github.com/Operation-Leyline/crucible", rev = "f7544a8b4802ec2409ce1c64eeba9527fa55992d", default-features = false, features = ["http"] }
crucible-build = { git = "https://github.com/Operation-Leyline/crucible", rev = "f7544a8b4802ec2409ce1c64eeba9527fa55992d", features = ["java"] }
