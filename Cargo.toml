resolver = "3"

[workspace.dependencies]
crucible = { git = "https://github.com/Operation-Leyline/crucible", rev = "0d0ba80ddf4930c97bf784ca3122e30a39d29ff6", default-features = false, features = ["http"] }
crucible-build = { git = "https://github.com/Operation-Leyline/crucible", rev = "0d0ba80ddf4930c97bf784ca3122e30a39d29ff6", features = ["java"] }
